<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAYAN AHMED SHAMIM</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Card */
.card {
    background: white;
    width: 360px;
    max-width: 90%;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* Profile Image */
.card img {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #4f46e5;
}

/* Name */
h1 {
    margin: 15px 0 5px;
    font-size: 22px;
    letter-spacing: 2px;
}

/* Subtitle */
h3 {
    margin: 0;
    color: #666;
    font-weight: normal;
}

/* About */
p {
    font-size: 14px;
    color: #555;
    margin: 15px 0;
    line-height: 1.5;
}

/* Buttons */
.links a {
    display: block;
    text-decoration: none;
    color: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    font-size: 14px;
    transition: 0.3s;
}

/* Social Colors */
.facebook { background: #1877F2; }
.instagram { background: #E1306C; }
.tiktok { background: #000000; }

.links a:hover {
    opacity: 0.85;
    transform: scale(1.03);
}

/* Footer */
.footer {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
}
</style>

</head>
<body>

<div class="card">

    <!-- Profile Image -->
    <img src="IMG_6100.jpeg" alt="Profile Picture">

    <!-- Name -->
    <h1>SHAYAN AHMED SHAMIM</h1>
    <h3>Student | Content Creator</h3>

    <!-- About -->
    <p>
        Welcome to my personal website.  
        I am passionate about learning, technology and content creation.
    </p>

    <!-- Social Links -->
    <div class="links">
        <a class="facebook" href="https://www.facebook.com/share/19D3Fdrq3D/?mibextid=wwXIfr" target="_blank">Facebook</a>

        <a class="instagram" href="https://www.instagram.com/shayan_shamim95?igsh=MTdoM3JxZTNlYXN1dQ%3D%3D&utm_source=qr" target="_blank">Instagram</a>

        <a class="tiktok" href="https://www.tiktok.com/@shayanofficially?_r=1&_t=ZS-96zvRrlMg2G" target="_blank">TikTok</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2026 All Rights Reserved
    </div>

</div>

</body>
</html>
